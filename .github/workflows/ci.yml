name: ci
on: [push, pull_request]
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: "3.12"}
      - name: Install (no Laya: tests use a fake classifier)
        run: |
          python -m pip install --upgrade pip
          grep -v '^laya' router/requirements.txt > /tmp/req.txt
          python -m pip install -r /tmp/req.txt pytest
      - name: Unit tests
        run: |
          cd router && python -m pytest -q tests
          cd ../admin && PYTHONPATH=.:../router python -m pytest -q tests
      - name: End to end (real LiteLLM, fake upstreams)
        run: |
          PY=$(which python) router/tests/e2e_router.sh
          PY=$(which python) router/tests/e2e_masked.sh
